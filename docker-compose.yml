version: "3.9"

services:

  nginx:
    image: nginx:alpine
    container_name: uas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - php-html:/var/www/html:ro
    depends_on:
      - app1-static
      - app2-php
    networks:
      - app-net

  app1-static:
    image: muhamadmahbub383/uas_2388010014:app1-latest
    container_name: uas-app1-static
    restart: unless-stopped
    networks:
      - app-net

  app2-php:
    image: muhamadmahbub383/uas_2388010014:app2-latest
    container_name: uas-app2-php
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: app_db
      DATABASE_USER: app_user
      DATABASE_PASS: apppassword123
    volumes:
      - php-html:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: mariadb:10.11
    container_name: uas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE:      app_db
      MYSQL_USER:          app_user
      MYSQL_PASSWORD:      apppassword123
    volumes:
      - db-data:/var/lib/mysql
      - ./app2-php/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

volumes:
  db-data:
  php-html:

networks:
  app-net:
    driver: bridge
